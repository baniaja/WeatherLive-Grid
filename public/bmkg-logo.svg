<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bmkgOuterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F4C81"/>
      <stop offset="100%" stop-color="#002147"/>
    </linearGradient>
    <linearGradient id="bmkgGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF00"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="bmkgGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="bmkgBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="bmkgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#002147" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Ring Shadow & Base -->
  <circle cx="100" cy="100" r="96" fill="url(#bmkgOuterGrad)" stroke="#F59E0B" stroke-width="4" filter="url(#bmkgGlow)"/>

  <!-- Inner Circle Base -->
  <circle cx="100" cy="100" r="84" fill="#FFFFFF" stroke="#0F4C81" stroke-width="2.5"/>

  <!-- Sun Radiance Upper Arc -->
  <path d="M 45 92 A 58 58 0 0 1 155 92 Z" fill="url(#bmkgGoldGrad)"/>
  
  <!-- Sun Core -->
  <circle cx="100" cy="85" r="22" fill="#FDE047" stroke="#F59E0B" stroke-width="2"/>

  <!-- Sun Rays / Atmospheric Lines -->
  <line x1="100" y1="50" x2="100" y2="38" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <line x1="72" y1="58" x2="64" y2="48" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <line x1="128" y1="58" x2="136" y2="48" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <line x1="52" y1="78" x2="42" y2="74" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <line x1="148" y1="78" x2="158" y2="74" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>

  <!-- Climatological & Earth Arcs (Green) -->
  <path d="M 38 106 Q 100 132 162 106 Q 100 118 38 106 Z" fill="url(#bmkgGreenGrad)"/>
  <path d="M 42 120 Q 100 146 158 120 Q 100 132 42 120 Z" fill="url(#bmkgGreenGrad)"/>

  <!-- Ocean Waves & Marine Meteorology (Blue Arcs) -->
  <path d="M 48 134 Q 74 148 100 136 Q 126 124 152 136 Q 100 152 48 134 Z" fill="url(#bmkgBlueGrad)"/>
  <path d="M 56 148 Q 100 166 144 148 Q 100 160 56 148 Z" fill="#0284C7"/>

  <!-- BMKG Official Text Badge Bottom -->
  <rect x="52" y="156" width="96" height="24" rx="12" fill="#002147" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="100" y="173" font-family="'Space Grotesk', 'Inter', Arial, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">BMKG</text>
</svg>
